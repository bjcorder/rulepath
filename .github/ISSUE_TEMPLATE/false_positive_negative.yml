name: False positive or false negative
description: Report a finding that should not appear or a missed issue.
title: "[signal]: "
labels: ["analysis-signal"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Signal issue type
      options:
        - False positive
        - False negative
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule or hint ID
      placeholder: INV001
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal code sample
      render: text
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant .rulepath.yml
      render: yaml
  - type: textarea
    id: output
    attributes:
      label: Rulepath output
      render: text
