name: Rule request
description: Propose a new invariant rule or review hint.
title: "[rule]: "
labels: ["rule-request"]
body:
  - type: textarea
    id: invariant
    attributes:
      label: Invariant
      description: What business or security invariant should Rulepath check?
    validations:
      required: true
  - type: textarea
    id: unsafe
    attributes:
      label: Unsafe example
      render: text
    validations:
      required: true
  - type: textarea
    id: safe
    attributes:
      label: Safe example
      render: text
    validations:
      required: true
  - type: textarea
    id: confidence
    attributes:
      label: High-confidence gate
      description: What evidence should be required before this becomes a finding?
