name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        # actions/checkout v4, pinned to a full commit SHA.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Rust
        # dtolnay/rust-toolchain stable branch snapshot, pinned to a full commit SHA.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Dependency resolution
        run: cargo metadata --locked --format-version 1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Build
        run: cargo build --locked --workspace
