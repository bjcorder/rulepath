name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        # actions/checkout v4, pinned to a full commit SHA.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Dependency pinning
        # bjcorder/deterministic-deps main snapshot, pinned to a full commit SHA.
        uses: bjcorder/deterministic-deps@838ba7893ec59d17e7883fbc1629a222dacb431b
        with:
          mode: enforce
          severity-threshold: medium
          sarif: false
          remote-validation: true
      - name: Install Rust
        # dtolnay/rust-toolchain stable branch snapshot, pinned to a full commit SHA.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Dependency pinning contract
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-dependency-pinning.ps1
      - name: Dependency resolution
        run: cargo metadata --locked --format-version 1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets
      - name: Test
        run: cargo test --locked --workspace
      - name: Build
        run: cargo build --locked --workspace
